id: agent-room
name: Agent Room Backend
version: 0.4.0
description: >-
  Durable model-free shared-room backend for protoAgent: one fixed room,
  ordered messages, stable client-message deduplication, cursors, membership,
  mention-only named-delegate replies, a gated local API, and deterministic
  A2A post/sync/ack/members operations.
enabled: false
repository: https://github.com/RomeoRaven/agent-room-plugin
min_protoagent_version: "0.142.1"

config_section: agent_room
config:
  data_dir: ""
  local_principal: operator
  peer_principal: ""
  owner:
    principal: operator
    kind: human
    display_name: Operator
    role: owner
    mention_token: "@Operator"
    host: operator
    can_post: true
    can_mention: true
  members: []
  dispatch_targets: {}
  mention_policy:
    max_agent_hops: 1
    max_mentions_per_target: 5
    rate_window_seconds: 60

capabilities:
  network: []
  filesystem: scoped

emits: []
subscribes: []
public_paths: []
