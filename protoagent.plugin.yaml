id: agent-room
name: Agent Room Backend
version: 0.6.0
description: >-
  Durable model-free shared-room owner and deterministic peer client for protoAgent: subject rooms,
  lifecycle, bounded history, indexed search, ordered messages, stable
  client-message deduplication, cursors, membership, mention-only named-delegate
  replies, a gated local API, and deterministic Room operations.
enabled: false
repository: https://github.com/RomeoRaven/agent-room-plugin
min_protoagent_version: "0.142.1"

config_section: agent_room
config:
  data_dir: ""
  mode: owner
  local_principal: operator
  peer_principal: ""
  peer_url: ""
  peer_token_file: ""
  peer_ca_file: ""
  peer_timeout_seconds: 30
  reconcile_interval_seconds: 5
  owner:
    principal: operator
    kind: human
    display_name: Operator
    role: owner
    mention_token: "@Operator"
    host: operator
    can_post: true
    can_mention: true
  members: []
  dispatch_targets: {}
  mention_policy:
    max_agent_hops: 1
    max_mentions_per_target: 5
    rate_window_seconds: 60

capabilities:
  network: ["protoagent-a2a.family.home"]
  filesystem: scoped

emits: []
subscribes: []
public_paths: []
